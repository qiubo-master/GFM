services:
  ai-foundation:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:6010:6010"
    volumes:
      - /root/autodl-tmp/ai-foundation-data:/data
      - /root/autodl-tmp/models:/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /root/autodl-tmp/ai-foundation-data/redis:/data
    restart: unless-stopped

# 第一阶段继续复用宿主机上的 Ollama。
# .env 中设置 OLLAMA_BASE_URL=http://host.docker.internal:11434。
# PostgreSQL、MinIO 和独立 worker 在完成最小链路后加入。

