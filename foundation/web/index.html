<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GFM 通用大模型基座</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#667085;--line:#e4e9f2;--brand:#3157d5}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#10182c;color:#fff;padding:28px 20px}.logo{font-size:25px;font-weight:800}.logo small{display:block;color:#99a6c2;font-size:12px;margin-top:6px}.nav{margin-top:35px}.nav button{width:100%;border:0;background:transparent;color:#aeb9d2;text-align:left;padding:13px 14px;border-radius:10px;margin:4px 0;font-size:15px;cursor:pointer}.nav button.active{color:#fff;background:linear-gradient(90deg,#3157d5,#6547d8)}main{padding:34px 42px;max-width:1480px}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.hero h1{margin:0;font-size:30px}.hero p,.desc,.hint{color:var(--muted)}.health,.auth,.apis,.debug{background:var(--panel);border:1px solid var(--line);border-radius:14px}.health{padding:12px 16px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e4a000;margin-right:8px}.dot.ok{background:#1eaf77}.auth{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;padding:16px;margin-bottom:22px}input,textarea{width:100%;border:1px solid #ccd4e1;border-radius:9px;padding:11px;font:inherit}.btn{border:0;border-radius:9px;padding:11px 16px;background:var(--brand);color:#fff;cursor:pointer;font-weight:600}.btn.alt{background:#edf1ff;color:#294dcc}.grid{display:grid;grid-template-columns:minmax(380px,1fr) minmax(430px,1.15fr);gap:22px}.apis,.debug{overflow:hidden}.title{padding:18px 20px;border-bottom:1px solid var(--line);font-weight:700}.api{padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer}.api:hover,.api.selected{background:#f5f7ff}.method{font-size:11px;font-weight:800;padding:4px 7px;border-radius:5px;margin-right:8px;background:#e7edff;color:#3157d5}.method.get{background:#e3f7ef;color:#16845b}.path,.endpoint{font-family:Consolas,monospace;font-size:13px}.desc{margin:8px 0 0;font-size:13px}.body{padding:20px}.endpoint{background:#f2f4f8;padding:12px;border-radius:9px;word-break:break-all}.field{margin-top:16px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field textarea{min-height:180px;resize:vertical;font-family:Consolas,monospace}.actions{display:flex;gap:10px;margin-top:16px}.result{margin-top:18px;background:#10182c;color:#d9e2f5;border-radius:10px;padding:15px;min-height:160px;max-height:430px;overflow:auto;white-space:pre-wrap;font:12px/1.6 Consolas,monospace}.hint{font-size:13px;line-height:1.7}.hidden{display:none}@media(max-width:900px){.shell{display:block}.side{padding-bottom:16px}.nav{display:flex;margin-top:16px}.nav button{width:auto}.grid{grid-template-columns:1fr}.auth{grid-template-columns:1fr}main{padding:24px 16px}.hero{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">GFM<small>General Foundation Models</small></div><nav class="nav"><button class="active" data-group="text">文本大模型</button><button data-group="vision">视觉大模型</button></nav></aside><main><div class="hero"><div><h1 id="heading"></h1><p>接口说明、参数示例和在线调试集中在一个页面。</p></div><div class="health"><span class="dot" id="dot"></span><span id="health">正在检查服务</span></div></div><div class="auth"><input id="appId" placeholder="X-App-Id"><input id="apiKey" type="password" placeholder="X-API-Key"><button class="btn alt" id="save">保存本次会话</button></div><div class="grid"><section class="apis"><div class="title" id="listTitle"></div><div id="apiList"></div></section><section class="debug"><div class="title">接口说明与调试</div><div class="body"><h2 id="apiName"></h2><div class="endpoint" id="endpoint"></div><p class="hint" id="apiDesc"></p><div class="field hidden" id="fileField"><label>图片文件</label><input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp"></div><div class="field" id="bodyField"><label>请求 JSON</label><textarea id="requestBody"></textarea></div><div class="actions"><button class="btn" id="send">发送请求</button><button class="btn alt" id="format">格式化 JSON</button></div><div class="result" id="result">响应结果将在这里显示</div></div></section></div></main></div>
<script>
const apis={text:[{name:'服务健康检查',method:'GET',path:'/foundation/v1/health',auth:false,desc:'检查基座、Ollama 和模型列表。'},{name:'模型与能力列表',method:'GET',path:'/foundation/v1/models',desc:'返回当前文本、向量和视觉模型。'},{name:'文本对话',method:'POST',path:'/foundation/v1/text/chat',desc:'调用 Qwen 文本大模型，支持多轮消息。',body:{messages:[{role:'user',content:'请用三句话介绍轮胎保养'}],options:{temperature:.2}}},{name:'文本向量化',method:'POST',path:'/foundation/v1/embeddings',desc:'生成用于 RAG 检索的文本向量。',body:{input:['轮胎胎压多久检查一次？']}}],vision:[{name:'上传图片',method:'POST',path:'/foundation/v1/images',desc:'上传 JPEG、PNG 或 WebP，取得 image_id。',file:true},{name:'YOLO 目标检测',method:'POST',path:'/foundation/v1/vision/detect',desc:'返回类别、置信度和边界框。',body:{image_id:'img_请替换'}},{name:'OCR 文字识别',method:'POST',path:'/foundation/v1/vision/ocr',desc:'返回文字、置信度和坐标。',body:{image_id:'img_请替换'}},{name:'Qwen-VL 图像理解',method:'POST',path:'/foundation/v1/vision/understand',desc:'让视觉大模型回答图片问题。',body:{image_id:'img_请替换',scene:'general',question:'请描述图片关键信息'}},{name:'完整视觉分析',method:'POST',path:'/foundation/v1/vision/analyze',desc:'一次完成 YOLO、OCR、Qwen-VL 和结构化融合。',body:{image_id:'img_请替换',scene:'general',question:'请给出结构化分析'}},{name:'创建异步任务',method:'POST',path:'/foundation/v1/tasks',desc:'提交视觉任务并返回 task_id。',body:{image_id:'img_请替换',scene:'general',question:'请分析图片'}},{name:'查询异步任务',method:'GET',path:'/foundation/v1/tasks/task_请替换',desc:'查询 Redis 中的任务状态和结果。'}]};let group='text',selected=0;const $=x=>document.getElementById(x);function render(){let list=apis[group];$('heading').textContent=group==='text'?'文本大模型 API':'视觉大模型 API';$('listTitle').textContent=group==='text'?'文本接口':'视觉接口';$('apiList').innerHTML=list.map((a,i)=>`<div class="api ${i===selected?'selected':''}" data-i="${i}"><span class="method ${a.method.toLowerCase()}">${a.method}</span><span class="path">${a.path}</span><p class="desc">${a.name}</p></div>`).join('');document.querySelectorAll('.api').forEach(x=>x.onclick=()=>{selected=+x.dataset.i;render()});show(list[selected])}function show(a){$('apiName').textContent=a.name;$('endpoint').textContent=`${a.method} ${location.origin}${a.path}`;$('apiDesc').textContent=a.desc;$('fileField').classList.toggle('hidden',!a.file);$('bodyField').classList.toggle('hidden',a.method==='GET'||a.file);$('requestBody').value=a.body?JSON.stringify(a.body,null,2):''}function headers(auth=true){let h={};if(auth){h['X-App-Id']=$('appId').value.trim();h['X-API-Key']=$('apiKey').value.trim()}return h}async function send(){let a=apis[group][selected],t=performance.now();$('result').textContent='请求处理中…';try{let o={method:a.method,headers:headers(a.auth!==false)};if(a.file){let f=$('imageFile').files[0];if(!f)throw Error('请先选择图片');o.body=f;o.headers['Content-Type']=f.type}else if(a.method!=='GET'){o.headers['Content-Type']='application/json';o.body=$('requestBody').value}let r=await fetch(a.path,o),tx=await r.text(),out;try{out=JSON.stringify(JSON.parse(tx),null,2)}catch{out=tx}$('result').textContent=`HTTP ${r.status} · ${Math.round(performance.now()-t)} ms\n\n${out}`}catch(e){$('result').textContent='请求失败：'+e.message}}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');group=b.dataset.group;selected=0;render()});$('send').onclick=send;$('format').onclick=()=>{try{$('requestBody').value=JSON.stringify(JSON.parse($('requestBody').value),null,2)}catch(e){$('result').textContent='JSON 错误：'+e.message}};$('save').onclick=()=>{sessionStorage.gfmApp=$('appId').value;sessionStorage.gfmKey=$('apiKey').value;$('result').textContent='凭据仅保存在当前浏览器会话。'};$('appId').value=sessionStorage.gfmApp||'';$('apiKey').value=sessionStorage.gfmKey||'';fetch('/foundation/v1/health').then(r=>r.json()).then(x=>{$('dot').classList.add('ok');$('health').textContent=`服务正常 · ${x.models?.length||0} 个模型`}).catch(()=>{$('health').textContent='服务不可用'});render();
</script></body></html>
