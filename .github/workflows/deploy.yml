name: ForgeOps Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]

concurrency:
  group: gfm-autodl2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and test
        run: |
          test -f Dockerfile
          test -f compose.yml
          python -m compileall -q foundation
      - name: Request deployment
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" -H "Content-Type: application/json" \
            -d "{\"action\":\"$ACTION\",\"sha\":\"$GITHUB_SHA\"}" \
            "$DEPLOY_URL/foundation/internal/deploy"
      - name: Wait for activation and verify health
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          for attempt in $(seq 1 60); do
            payload=$(curl --silent --show-error --max-time 15 -H "X-Deploy-Token: $DEPLOY_TOKEN" "$DEPLOY_URL/foundation/internal/deploy/status" || true)
            echo "Attempt $attempt: $payload"
            echo "$payload" | grep -q '"status":"failed"' && exit 1
            echo "$payload" | grep -q '"status":"success"' && break
            sleep 5
          done
          echo "$payload" | grep -q '"status":"success"'
          curl --fail --silent --show-error --max-time 30 "$DEPLOY_URL/foundation/v1/health"
